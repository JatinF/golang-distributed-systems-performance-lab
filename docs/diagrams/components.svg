<text x="32" y="72" fill="#ffffff" font-family="Segoe UI, system-ui, Arial, sans-serif" font-size="28" font-weight="700">Components and trust boundary</text>
<text x="1088" y="46" fill="#8fe0b8" font-family="Segoe UI, system-ui, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="end">one process</text>
<text x="1088" y="70" fill="#c5d4e0" font-family="Segoe UI, system-ui, Arial, sans-serif" font-size="13" text-anchor="end">price none</text>
<rect x="24" y="128" width="1072" height="520" rx="18" fill="none" stroke="#0f6e6e" stroke-width="2" stroke-dasharray="7 6"/>
