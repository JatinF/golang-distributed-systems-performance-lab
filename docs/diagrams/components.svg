<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="820" viewBox="0 0 1120 820" role="img" aria-labelledby="componentTitle componentDesc">
<title id="componentTitle">Components and trust boundary</title>
<desc id="componentDesc">SYN-TENANT-QUORUM runs in one process. Identity, the ledger, the worker pool, miniredis, embedded JetStream, and embedded PostgreSQL are inside the boundary. Remote PostgreSQL, Redis, NATS, OIDC, Docker, and Kubernetes are outside and were not contacted.</desc>
