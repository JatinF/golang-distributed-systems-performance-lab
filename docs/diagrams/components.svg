<text x="56" y="244" fill="#102033" font-family="Segoe UI, system-ui, Arial, sans-serif" font-size="15" font-weight="700">HTTP and gRPC</text>
<text x="56" y="270" fill="#5c6b7a" font-family="Segoe UI, system-ui, Arial, sans-serif" font-size="13">127.0.0.1 only</text>
<text x="56" y="294" fill="#5c6b7a" font-family="Segoe UI, system-ui, Arial, sans-serif" font-size="13">Bearer stays in metadata</text>
<text x="56" y="324" fill="#1d4e89" font-family="Segoe UI, system-ui, Arial, sans-serif" font-size="12" font-weight="700">Work.Submit and Stream</text>
