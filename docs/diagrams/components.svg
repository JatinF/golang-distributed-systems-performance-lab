<text x="628" y="294" fill="#5c6b7a" font-family="Segoe UI, system-ui, Arial, sans-serif" font-size="13">Failure is not remembered</text>
<text x="628" y="324" fill="#1d4e89" font-family="Segoe UI, system-ui, Arial, sans-serif" font-size="12" font-weight="700">retry stays possible</text>
